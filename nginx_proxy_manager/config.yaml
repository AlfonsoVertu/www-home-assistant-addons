---
name: Nginx Proxy Manager
version: 4.1.0-www1
slug: nginxproxymanager
description: Manage Nginx proxy hosts with a simple, powerful interface (Working With Web build of the Home Assistant Community app v4.1.0, MIT)
url: https://github.com/hassio-addons/app-nginx-proxy-manager
webui: http://[HOST]:[PORT:81]
startup: services
init: false
arch:
  - aarch64
  - amd64
hassio_api: true
ports:
  80/tcp: 80
  81/tcp: 81
  443/tcp: 443
map:
  - addon_config:rw
backup_exclude:
  - "*/logs"
