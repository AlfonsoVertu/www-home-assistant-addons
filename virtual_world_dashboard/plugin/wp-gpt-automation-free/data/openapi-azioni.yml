paths:
  /v1/tools-manifest:
    post:
      operationId: toolsManifest
      summary: "L'attrezzo per orientarsi: elenca i tool di questo sito, le action di ognuno e i parametri di ogni action."
      description: "L'attrezzo per orientarsi: elenca i tool di questo sito, le action di ognuno e i parametri di ogni action. Un solo endpoint con tante action: il parametro action decide quali altri parametri servono."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: ["lista-dei-tool-che-contengono-le-action", "scopri-parametri-dei-tool", "scopri-parametri-di-un-action-in-un-tool", "istruzioni", "schema", "stretta-di-mano"]
                  description: "Quale operazione eseguire: decide quali altri parametri servono. I valori ammessi sono quelli elencati in enum. Per sapere cosa vuole una singola operazione chiama questa stessa rotta con action=documentazione_<nome-action>."
                cerca:
                  type: string
                  description: "Opzionale per: lista-dei-tool-che-contengono-le-action. Filtra per nome o descrizione. Accetta un pezzo di parola, e perdona una lettera fuori posto."
                pagina:
                  type: integer
                  description: "Opzionale per: lista-dei-tool-che-contengono-le-action. Pagina da leggere, a partire da 1."
                per_pagina:
                  type: integer
                  description: "Opzionale per: lista-dei-tool-che-contengono-le-action. Quanti tool per pagina."
                tool:
                  type: string
                  description: "Obbligatorio per: scopri-parametri-dei-tool, scopri-parametri-di-un-action-in-un-tool. Opzionale per: schema. scopri-parametri-dei-tool: Il nome del tool, che e' il nome della sua rotta. scopri-parametri-di-un-action-in-un-tool: Il nome del tool. schema: Limita lo schema a un tool solo."
                nome_action:
                  type: string
                  description: "Obbligatorio per: scopri-parametri-di-un-action-in-un-tool. L'action da aprire."
                odoo_url:
                  type: string
                  description: "Obbligatorio per: stretta-di-mano. L'indirizzo a cui questo sito ti richiamera'."
                odoo_token:
                  type: string
                  description: "Obbligatorio per: stretta-di-mano. Il token con cui ti riconoscerai."
                odoo_user_code:
                  type: string
                  description: "Obbligatorio per: stretta-di-mano. Il tuo codice utente."
                riferimento:
                  type: string
                  description: "Opzionale per: stretta-di-mano. Un'etichetta tua, per ritrovare l'accordo."
  /v1/memory/goal:
