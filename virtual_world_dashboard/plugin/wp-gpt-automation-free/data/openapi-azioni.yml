                  description: "Quale operazione eseguire: decide quali altri parametri servono. I valori ammessi sono quelli elencati in enum. Per sapere cosa vuole una singola operazione chiama questa stessa rotta con action=documentazione_<nome-action>."
                limit:
                  type: integer
                  description: "Opzionale per: list_goals, list_steps. Quanti risultati per volta."
                offset:
                  type: integer
                  description: "Opzionale per: list_goals, list_steps. Da quale risultato cominciare, per scorrere le pagine."
                status:
                  type: string
                  description: "Opzionale per: list_goals, update_goal, list_steps, add_step, update_step. list_goals/list_steps: Restringe a uno stato. update_goal: A che punto e l obiettivo. add_step: A che punto e il passo. update_step: Lo stato nuovo."
                include_deleted:
                  type: boolean
                  description: "Opzionale per: list_goals, list_steps. Se mostrare anche quelli messi da parte con delete."
                goal_id:
                  type: integer
                  description: "Obbligatorio per 9 action su 18. Id dell obiettivo, preso da list_goals."
                goal_title:
                  type: string
                  description: "Obbligatorio per: create_goal. Opzionale per: update_goal. Come si chiama l obiettivo."
                goal_type:
                  type: string
                  description: "Opzionale per: create_goal, update_goal. Di che genere e l obiettivo."
                keyword:
                  type: string
                  description: "Opzionale per: create_goal, update_goal. Una parola per ritrovarlo."
                meta:
                  type: object
                  description: "Opzionale per: create_goal, update_goal, add_step, update_step. create_goal/update_goal: Dati in piu da tenere insieme all obiettivo. add_step: Dati in piu da tenere insieme al passo. update_step: Dati in piu."
                hard:
                  type: boolean
                  description: "Opzionale per: delete_all_goals, delete_all_steps. Vero per cancellare davvero invece di mettere da parte."
                step_id:
                  type: integer
                  description: "Obbligatorio per: get_step, update_step, delete_step, hard_delete_step. Id del passo, preso da list_steps."
                step_label:
                  type: string
                  description: "Obbligatorio per: add_step. Opzionale per: update_step. add_step: Cosa dice il passo. update_step: Il testo nuovo del passo."
                step_type:
                  type: string
                  description: "Opzionale per: add_step, update_step. add_step: Di che genere e il passo. update_step: Il genere del passo."
                chunk_key:
                  type: string
                  description: "Obbligatorio per: get_chunked_response, delete_chunk. get_chunked_response: La chiave restituita dalla risposta troncata. delete_chunk: La chiave della risposta da buttare."
                chunk_index:
                  type: integer
                  description: "Opzionale per: get_chunked_response. Quale pezzo leggere, da 0."
