  /v1/route-scheduler:
    post:
      operationId: routeScheduler
      summary: "Programma chiamate ad altre rotte di questo sito perche avvengano piu tardi, una volta sola o a ripetizione, e ne segue lesito."
      description: "Programma chiamate ad altre rotte di questo sito perche avvengano piu tardi, una volta sola o a ripetizione, e ne segue lesito. Un solo endpoint con tante action: il parametro action decide quali altri parametri servono."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: ["list_jobs", "add_job", "remove_job", "run_job", "get_log", "set_logging"]
                  description: "Quale operazione eseguire: decide quali altri parametri servono. I valori ammessi sono quelli elencati in enum. Per sapere cosa vuole una singola operazione chiama questa stessa rotta con action=documentazione_<nome-action>."
                page:
                  type: integer
                  description: "Opzionale per: list_jobs, get_log. list_jobs: Quale pagina di risultati, da 1. get_log: Quale pagina di righe, da 1."
                per_page:
                  type: integer
                  description: "Opzionale per: list_jobs, get_log. list_jobs: Quanti lavori per pagina, al massimo 100. get_log: Quante righe per pagina, al massimo 500."
                status:
                  type: string
                  description: "Opzionale per: list_jobs. Restringe a uno stato, per esempio active."
                search:
                  type: string
                  description: "Opzionale per: list_jobs, get_log. list_jobs: Cerca nel nome del lavoro e dentro la sua definizione, quindi trova anche per rotta chiamata. get_log: Tiene solo le righe che contengono questo testo. Maiuscole e minuscole non contano."
                job_key:
                  type: string
                  description: "Obbligatorio per: add_job, remove_job, run_job, get_log. Opzionale per: list_jobs. list_jobs: Restringe a un lavoro solo. add_job/remove_job/run_job/get_log: La chiave del lavoro, quella scelta con add_job. Serve a ritrovarlo: conviene un nome che dica cosa fa."
                definition:
                  type: object
                  description: "Obbligatorio per: add_job. Cosa fare: target_route, obbligatorio, il percorso REST relativo da chiamare, per esempio /wp-gpt/v1/rotta - un indirizzo completo viene rifiutato; payload, i parametri da mandare; schedule, quando e ogni quanto; headers, intestazioni in piu."
                logging:
                  type: boolean
                  description: "Obbligatorio per: set_logging. Vero per scrivere il registro, falso per smettere."
  /v1/ssh-connection:
