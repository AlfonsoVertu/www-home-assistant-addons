                  description: "Obbligatorio per: control-entity, execute. control-entity: Il dominio del servizio: light, switch, climate, media_player, cover, scene, script. execute: Il genere di cosa da comandare, per esempio light o switch. E la prima parte dell entity_id, quella prima del punto."
                service:
                  type: string
                  description: "Obbligatorio per: control-entity, execute. control-entity: Il servizio da chiamare: turn_on, turn_off, toggle, set_temperature. execute: Cosa fargli fare, per esempio turn_on o turn_off."
                entity_id:
                  type: string
                  description: "Obbligatorio per: get-camera-screen, get-history, get-calendar-events, get-shortcode. Opzionale per: control-entity, get-logbook, execute. control-entity: L'entita' su cui agire. Si ricava con search. get-camera-screen: La telecamera, es. camera.ingresso. get-history: L'entita' di cui leggere la storia. get-logbook: Limita il diario a una sola entita'. get-calendar-events: Il calendario, es. calendar.famiglia. get-shortcode: L'entita' da mostrare. execute: Su quale cosa preciso agire, come lo restituisce discover. Senza, il comando vale per tutto il dominio: e il modo di spegnere per sbaglio ogni luce della casa."
                payload:
                  type: object
                  description: "Opzionale per: control-entity. Dati aggiuntivi per il servizio."
                text:
                  type: string
                  description: "Obbligatorio per: send-command-to-assistant, send-message-home-assistant-agent. send-command-to-assistant: La frase da dire all'assistente. send-message-home-assistant-agent: La frase da dire allassistente."
                agent_id:
                  type: string
                  description: "Opzionale per: send-command-to-assistant, send-message-home-assistant-agent. send-command-to-assistant: Quale assistente, se ce n'e' piu' d'uno. send-message-home-assistant-agent: Quale assistente, se ce ne e piu di uno. Si trovano con discover chiedendo type assistants."
                start:
                  type: string
                  description: "Opzionale per: get-history, get-logbook, get-calendar-events. Inizio del periodo, in formato ISO 8601."
                end:
                  type: string
                  description: "Opzionale per: get-history, get-logbook, get-calendar-events. Fine del periodo, in formato ISO 8601."
                columns:
                  type: integer
                  description: "Opzionale per: get-shortcode. Su quante colonne disporla."
                type:
                  type: string
                  description: "Opzionale per: discover. Che genere di cose elencare: all tutto, entities i dispositivi, scripts gli script, automations le automazioni, assistants gli assistenti vocali."
                entities:
                  type: string
                  description: "Opzionale per: discover. Restringe a identificativi precisi, separati da virgola."
                per_page:
                  type: integer
                  description: "Opzionale per: discover. Quanti risultati per pagina, al massimo 100."
                data:
                  type: object
                  description: "Opzionale per: execute. Dettagli in piu per il servizio, per esempio la luminosita o il colore."
                conversation_id:
                  type: string
                  description: "Opzionale per: send-message-home-assistant-agent. Il filo di una conversazione gia cominciata, per farsi capire quando la frase si riferisce a quella prima."
  /v1/manage-credentials-rotation-refresh-token:
    post:
      operationId: manageCredentialsRotationRefreshToken
      summary: "Rinnova le credenziali di questo sito usando la chiave di rinnovo. Si usa proprio quando il codice utente non vale piu', quindi non ne chiede uno."
      description: "Rinnova le credenziali di questo sito usando la chiave di rinnovo. Si usa proprio quando il codice utente non vale piu', quindi non ne chiede uno. Un solo endpoint con tante action: il parametro action decide quali altri parametri servono."
