        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: ["chiedi-rotazione", "riprendi-credenziale", "stato"]
                  description: "Quale operazione eseguire: decide quali altri parametri servono. I valori ammessi sono quelli elencati in enum. Per sapere cosa vuole una singola operazione chiama questa stessa rotta con action=documentazione_<nome-action>."
                genere:
                  type: string
                  enum: ["user_code", "header", "parametro"]
                  description: "Obbligatorio per tutte le action. Quale credenziale. Il bearer non si tratta da qui: si rigenera dalla bacheca del sito."
                chiave:
                  type: string
                  description: "Obbligatorio per tutte le action. La chiave di rinnovo di quel genere, quella che il sito ti ha consegnato quando vi siete collegati."
