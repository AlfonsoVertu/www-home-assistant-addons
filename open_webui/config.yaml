name: "Open WebUI"
description: "Chat con i modelli di intelligenza artificiale (Ollama, llama.cpp, servizi compatibili OpenAI) da Home Assistant."
version: "0.12.3"
slug: "open_webui"
url: "https://github.com/AlfonsoVertu/www-home-assistant-addons/tree/main/open_webui"
init: false
arch:
  - amd64
  - aarch64
startup: application
boot: auto
map:
  - share:rw
ports:
  8080/tcp: 8096
ports_description:
  8080/tcp: Open WebUI (interfaccia web)
webui: "http://[HOST]:[PORT:8080]/"
panel_icon: "mdi:robot"
options:
  ollama_base_url: ""
  openai_api_base_url: ""
  openai_api_key: ""
  enable_signup: true
schema:
  ollama_base_url: str?
  openai_api_base_url: str?
  openai_api_key: password?
  enable_signup: bool
